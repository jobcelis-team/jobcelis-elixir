# Publishes automatically on every push to main that changes the package:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in mix.exs when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into mix.exs and commits it locally
#   3. compiles it and publishes it to Hex.pm
#   4. pushes the version commit and tags vX.Y.Z
# To release a minor or major version, raise it in mix.exs.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: |
          VERSION=$(grep -m1 '@version "' mix.exs | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: "v"

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i -E 's/@version "[^"]+"/@version "'"$VERSION"'"/' mix.exs

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          MISSING=""
          [ -n "$HEX_API_KEY" ] || MISSING="$MISSING HEX_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not publishing: add the repository secret(s)$MISSING, then run this workflow again (Actions > Release > Run workflow)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://hex.pm/api/packages/jobcelis/releases/${{ steps.v.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: erlef/setup-beam@v1
        if: steps.check.outputs.release == 'true'
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Compile
        if: steps.check.outputs.release == 'true'
        run: mix deps.get && mix compile --warnings-as-errors

      - name: Publish to Hex.pm
        if: steps.check.outputs.release == 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
